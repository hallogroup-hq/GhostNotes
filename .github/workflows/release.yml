name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyinstaller

      - name: Build Standalone Executable (.exe)
        run: |
          pyinstaller --clean --onefile --noconsole --name "GhostNotes" windows/main.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostNotes-Windows
          path: dist/GhostNotes.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build macOS App Bundle
        run: |
          cd macos
          chmod +x build.sh
          ./build.sh
          zip -r GhostNotes-macOS.zip GhostNotes.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostNotes-macOS
          path: macos/GhostNotes-macOS.zip

  publish-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: GhostNotes-Windows
          path: artifacts/windows

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: GhostNotes-macOS
          path: artifacts/macos

      - name: Prepare Release Files
        run: |
          mkdir -p release-files
          cp artifacts/windows/GhostNotes.exe release-files/GhostNotes-Windows.exe
          cp artifacts/macos/GhostNotes-macOS.zip release-files/GhostNotes-macOS.zip

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: GhostNotes ${{ github.ref_name }}
          files: |
            release-files/GhostNotes-Windows.exe
            release-files/GhostNotes-macOS.zip
          generate_release_notes: true
          draft: false
          prerelease: false
